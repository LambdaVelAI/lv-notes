# Runs every test on each push to main and on pull requests.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Install UI dependencies
        run: npm ci --prefix apps/desktop
      - name: UI tests
        run: npm test --prefix apps/desktop
      # Type-checks the UI, and builds dist/, which the Rust crate embeds.
      - name: Build the UI
        run: npm run build --prefix apps/desktop
      - name: Rust tests
        run: cargo test -p lv-core -p lv-desktop --locked
