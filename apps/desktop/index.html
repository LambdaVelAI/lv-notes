<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>lv-notes</title>
  </head>
  <body>
    <section id="welcome" class="welcome" data-tauri-drag-region hidden>
      <div class="welcome-card">
        <h1>lv-notes</h1>
        <p>Notes, drafts and the links between them, in one project file.</p>
        <div class="welcome-actions">
          <button id="new-project" class="primary">New project…</button>
          <button id="open-project">Open project…</button>
        </div>
      </div>
    </section>

    <div id="workspace" class="workspace" hidden>
      <aside class="sidebar">
        <div class="sidebar-top" data-tauri-drag-region></div>
        <div class="project">
          <button id="switch-project" class="project-name" title="Open another project"><span id="project-name"></span></button>
        </div>
        <div class="search-box">
          <input id="search" type="search" placeholder="Search" title="Search all notes (⇧⌘F)" spellcheck="false" autocomplete="off" />
        </div>
        <div class="section-head">
          <span>Notes</span>
          <button id="new-document" class="icon" title="New note (⌘N)">+</button>
        </div>
        <ul id="documents" class="documents"></ul>
        <div class="sidebar-footer">
          <button id="import-menu" title="Import a Jupyter Book or an Obsidian vault">Import…</button>
          <button id="export-menu" title="Export notes as Markdown">Export…</button>
        </div>
      </aside>

      <main class="main">
        <header class="main-top" data-tauri-drag-region>
          <div id="toolbar" class="toolbar">
            <select id="block-type" title="Block type">
              <option value="p">Paragraph</option>
              <option value="h1">Heading 1</option>
              <option value="h2">Heading 2</option>
              <option value="h3">Heading 3</option>
              <option value="code">Code</option>
              <option value="math">Equation</option>
            </select>
            <span class="sep"></span>
            <button data-command="strong" title="Bold (⌘B)"><b>B</b></button>
            <button data-command="emphasis" title="Italic (⌘I)"><i>I</i></button>
            <button data-command="inlineCode" title="Code (⌘E)"><code>&lt;/&gt;</code></button>
            <button data-command="inlineMath" title="Math (⇧⌘E, or type $x$; $$ and a space starts an equation)">∑</button>
            <button id="link-button" title="Link (⌘K, or type [[)">Link</button>
            <span class="sep"></span>
            <button data-command="quote" title="Quote">❝</button>
            <button data-command="bullets" title="Bulleted list">•</button>
            <button data-command="numbers" title="Numbered list">1.</button>
          </div>
          <span id="status" class="status"></span>
        </header>

        <div id="no-document" class="no-document">
          <p>No note open.</p>
          <button id="new-document-empty">New note</button>
        </div>

        <div id="search-pane" class="search-pane" hidden>
          <div id="search-results" class="search-page"></div>
        </div>

        <div id="editor-pane" class="editor-pane" hidden>
          <article class="page">
            <input id="title" class="title" placeholder="Untitled" spellcheck="true" />
            <div id="editor"></div>
            <section id="backlinks" class="backlinks"></section>
          </article>
        </div>
      </main>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
